<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f2f2;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    button {
      padding: 10px 16px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Test Website</h1>
    <p>This is a simple test website created for demonstration purposes.</p>
    <p>Click the button below to show a message.</p>
    <button onclick="showMessage()">Show Message</button>
    <div id="message" style="margin-top: 16px; color:#333;"></div>
  </div>
  <script>
    function showMessage() {
      document.getElementById('message').textContent = 'Hello! The test website is working.';
    }
  </script>
</body>
</html>
